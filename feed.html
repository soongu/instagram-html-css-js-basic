<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Instagram - 피드</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Grand+Hotel&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <header>
    <h1><a href="index.html">Instagram</a></h1>
    <nav>
      <ul class="nav-menu">
        <li><a href="index.html">홈</a></li>
        <li><a href="explore.html">탐색</a></li>
        <li><a href="feed.html">피드</a></li>
        <li><a href="profile.html">프로필</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <h2>피드</h2>

    <article>
      <header class="post-header">
        <img class="post-avatar" src="https://picsum.photos/seed/avatar1/64/64"
             alt="jaehoon 프로필 사진" width="32" height="32">
        <strong class="post-author">jaehoon</strong>
        <button type="button" class="post-more" popovertarget="postMenu"
                aria-label="더보기">⋯</button>
      </header>

      <figure class="post-photo">
        <span class="post-badge">NEW</span>
        <picture>
          <!-- 큰 화면(600px↑): 가로로 넓은 풍경 컷 -->
          <source media="(min-width: 600px)"
                  srcset="https://picsum.photos/seed/insta1wide/800/450">
          <!-- 기본(폰): 정사각형 + 해상도별 3종 -->
          <img src="https://picsum.photos/seed/insta1/600/600"
               srcset="https://picsum.photos/seed/insta1/400/400 400w,
                       https://picsum.photos/seed/insta1/600/600 600w,
                       https://picsum.photos/seed/insta1/800/800 800w"
               sizes="(min-width: 600px) 32rem, 100vw"
               alt="석양이 지는 제주도 협재 해변 — 하늘이 주황빛으로 물들었다"
               width="600" height="600">
        </picture>
        <figcaption>오늘의 일상 — 제주도 협재 해변</figcaption>
      </figure>

      <div class="post-actions">
        <button type="button" class="icon-btn" aria-label="좋아요">♥</button>
        <button type="button" class="icon-btn" aria-label="댓글">💬</button>
        <button type="button" class="icon-btn"
                command="show-modal" commandfor="shareDialog" aria-label="공유">↗</button>
        <button type="button" class="icon-btn icon-btn-save" aria-label="저장">🔖</button>
      </div>

      <ul class="tag-list">
        <li><a href="#sunset">#sunset</a></li>
        <li><a href="#travel">#travel</a></li>
        <li><a href="#제주도">#제주도</a></li>
        <li><a href="#협재해변">#협재해변</a></li>
        <li><a href="#노을맛집">#노을맛집</a></li>
        <li><a href="#여행스타그램">#여행스타그램</a></li>
        <li><a href="#감성사진">#감성사진</a></li>
      </ul>

      <form class="comment-form" action="/comments" method="post">
        <label for="comment-1">댓글</label>
        <textarea id="comment-1" name="comment" rows="1"
                  placeholder="댓글을 입력하세요..."
                  maxlength="200" required></textarea>
        <button type="submit">게시</button>
      </form>
    </article>

    <article>
      <figure>
        <img src="https://picsum.photos/seed/insta2/600/600"
             alt="동네 카페 테이블 위에 놓인 라떼아트가 그려진 커피잔"
             width="600" height="600"
             loading="lazy">
        <figcaption>오늘 발견한 동네 카페 #coffee #latte</figcaption>
      </figure>
    </article>

    <article>
      <figure>
        <img src="https://picsum.photos/seed/insta3/600/600"
             alt="공원 잔디밭에서 공을 물고 뛰어오는 골든 리트리버"
             width="600" height="600"
             loading="lazy">
        <figcaption>주말 산책 친구 #goldenretriever #weekend</figcaption>
      </figure>
    </article>

    <article>
      <figure>
        <img src="https://picsum.photos/seed/insta4/600/600"
             alt="해질녘 강가에서 노을을 바라보는 사람의 실루엣"
             width="600" height="600"
             loading="lazy">
        <figcaption>강가의 노을 #riverside #sunset</figcaption>
      </figure>
    </article>

    <article>
      <figure>
        <img src="https://picsum.photos/seed/insta5/600/600"
             alt="눈 쌓인 산 정상에서 본 일출 풍경"
             width="600" height="600"
             loading="lazy">
        <figcaption>새해 첫 일출 #mountain #sunrise</figcaption>
      </figure>
    </article>

    <article>
      <figure>
        <img src="https://picsum.photos/seed/insta6/600/600"
             alt="작은 골목길 카페 앞 자전거 한 대"
             width="600" height="600"
             loading="lazy">
        <figcaption>골목 산책 #alleyway #bike</figcaption>
      </figure>
    </article>

    <article>
      <figure>
        <img src="https://picsum.photos/seed/insta7/600/600"
             alt="도서관 책장 사이로 비치는 따스한 햇살"
             width="600" height="600"
             loading="lazy">
        <figcaption>오후의 도서관 #library #reading</figcaption>
      </figure>
    </article>

    <article>
      <figure>
        <img src="https://picsum.photos/seed/insta8/600/600"
             alt="비행기 창가에서 내려다본 구름 위 풍경"
             width="600" height="600"
             loading="lazy">
        <figcaption>구름 위에서 #airplane #travel</figcaption>
      </figure>
    </article>

    <article>
      <h3>오늘의 릴스</h3>
      <figure>
        <video controls
               muted
               loop
               poster="https://picsum.photos/seed/reel1/600/800"
               width="600" height="800">
          <source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4">
          <p>이 브라우저는 video 태그를 지원하지 않아요. 영상을 보시려면 최신 브라우저로 접속해주세요.</p>
        </video>
        <figcaption>오늘의 릴스 — 즐거운 한 컷 #reels</figcaption>
      </figure>
    </article>

    <article>
      <h3>오디오 일기</h3>
      <p>오늘 들었던 짧은 소리 한 토막. 재생 버튼을 눌러보세요.</p>
      <audio controls>
        <source src="https://www.w3schools.com/html/horse.mp3" type="audio/mpeg">
        <p>이 브라우저는 audio 태그를 지원하지 않아요.</p>
      </audio>
    </article>

    <!-- 게시물 더보기 메뉴 (Popover API) -->
    <div popover id="postMenu">
      <p>게시물 메뉴</p>
      <ul>
        <li><a href="#report">신고하기</a></li>
        <li><a href="#unfollow">팔로우 취소</a></li>
        <li><a href="#copy-link">링크 복사</a></li>
      </ul>
      <button type="button" popovertarget="postMenu" popovertargetaction="hide">닫기</button>
    </div>

    <!-- 공유 다이얼로그 (dialog + 인보커 커맨드) -->
    <dialog id="shareDialog">
      <h2>공유하기</h2>
      <p>이 게시물을 친구에게 보내보세요.</p>

      <form action="/share" method="post">
        <label for="share-to">받는 사람</label>
        <input type="text" id="share-to" name="shareTo"
               placeholder="친구 아이디" required>
        <button type="submit">보내기</button>
      </form>

      <form method="dialog">
        <button type="submit">닫기</button>
      </form>
    </dialog>
  </main>

  <footer>
    <p>&copy; 2026 Instagram Clone Project</p>
  </footer>
</body>
</html>
