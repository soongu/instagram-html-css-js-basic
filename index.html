<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Instagram - 로그인</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Grand+Hotel&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <main class="login-page">
    <div class="login-split">
      <!-- 왼쪽 히어로 — 헤드라인 + 폰 목업 -->
      <section class="login-hero">
        <h2 class="hero-headline">
          <span class="hero-accent">친한 친구</span>의 일상 속<br>순간들을 확인해 보세요.
        </h2>
        <div class="hero-phone">
          <img src="https://picsum.photos/seed/heroapp/280/560"
               alt="인스타그램 앱 화면 미리보기"
               width="260" height="520">
        </div>
      </section>

      <!-- 오른쪽 로그인 패널 -->
      <section class="login-panel">
        <div class="login-card">
          <h1 class="logo login-logo"><a href="index.html">Instagram</a></h1>

          <form class="login-form" action="/login" method="post">
            <p>
              <label class="sr-only" for="username">사용자 이름</label>
              <input type="text" id="username" name="username" class="form-input"
                     placeholder="휴대폰 번호, 사용자 이름 또는 이메일"
                     autocomplete="username"
                     required minlength="3" maxlength="30">
            </p>
            <p>
              <label class="sr-only" for="password">비밀번호</label>
              <input type="password" id="password" name="password" class="form-input"
                     placeholder="비밀번호"
                     autocomplete="current-password"
                     required minlength="8">
            </p>
            <button type="submit" class="btn-login">로그인</button>
          </form>

          <div class="login-or"><span>또는</span></div>

          <a class="fb-login" href="#facebook">Facebook으로 로그인</a>
          <p class="forgot"><a href="#reset-password">비밀번호를 잊으셨나요?</a></p>
        </div>

        <div class="login-card login-card-slim">
          <p>계정이 없으신가요? <a class="signup-link" href="signup.html">가입하기</a></p>
        </div>

        <p class="meta-wordmark">from <span>Meta</span></p>
      </section>
    </div>

    <!-- 하단 푸터 -->
    <footer class="login-footer">
      <nav aria-label="사이트 정보">
        <ul>
          <li><a href="#meta">Meta</a></li>
          <li><a href="about.html">소개</a></li>
          <li><a href="#blog">블로그</a></li>
          <li><a href="#jobs">채용 정보</a></li>
          <li><a href="help.html">도움말</a></li>
          <li><a href="https://github.com/instagram-clone" target="_blank" rel="noopener noreferrer">API</a></li>
          <li><a href="privacy.html">개인정보처리방침</a></li>
          <li><a href="terms.html">약관</a></li>
          <li><a href="#locations">위치</a></li>
          <li><a href="#meta-verified">Meta Verified</a></li>
        </ul>
      </nav>
      <p class="footer-bottom">한국어 &nbsp;&middot;&nbsp; &copy; 2026 Instagram Clone Project</p>
    </footer>
  </main>
  <script type="module" src="js/auth.js"></script>
</body>
</html>
