<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>오프라인 — Instagram 클론</title>
  <!-- 이 페이지는 오프라인에서도 떠야 해서, 바깥 파일을 안 부르고 혼자 다 갖고 있어요 -->
  <style>
    body {
      margin: 0;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      font-family: system-ui, -apple-system, sans-serif;
      background-color: #fafafa;
      color: #262626;
      text-align: center;
      padding: 1rem;
    }
    .logo {
      font-family: "Grand Hotel", cursive, system-ui;
      font-size: 2.5rem;
    }
    p {
      color: #6e6e6e;
    }
    button {
      padding: 0.6rem 1.4rem;
      border: none;
      border-radius: 8px;
      background-color: #0095f6;
      color: #fff;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="logo">Instagram</div>
  <h1>지금은 오프라인이에요</h1>
  <p>인터넷 연결이 끊겼어요. 연결을 확인한 뒤 다시 시도해 주세요.</p>
  <button type="button" id="retry">다시 시도</button>

  <script>
    // 인라인 스크립트 — 캐시에 저장된 이 페이지 안에서 바로 동작해요(바깥 파일 의존 없음)
    document.getElementById("retry").addEventListener("click", () => {
      location.reload();
    });
  </script>
</body>
</html>
