<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Instagram - 프로필</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Grand+Hotel&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body class="app">
  <!-- 모바일 상단 바 (작은 화면에서만 보임) -->
  <header class="topbar">
    <h1 class="logo"><a href="index.html">Instagram</a></h1>
    <div class="topbar-actions">
      <a href="#notifications" aria-label="알림">
        <svg class="ico" aria-hidden="true"><use href="assets/icons.svg#ico-heart"></use></svg>
      </a>
      <a href="#messages" aria-label="메시지">
        <svg class="ico" aria-hidden="true"><use href="assets/icons.svg#ico-message"></use></svg>
      </a>
    </div>
  </header>

  <!-- 데스크톱 좌측 사이드바 -->
  <nav class="sidebar" aria-label="주요 메뉴">
    <h1 class="logo sidebar-logo">
      <a href="index.html">
        <span class="logo-text">Instagram</span>
        <svg class="ico logo-mark" aria-hidden="true"><use href="assets/icons.svg#ico-instagram"></use></svg>
      </a>
    </h1>
    <ul class="sidebar-menu">
      <li><a href="feed.html">
        <svg class="ico" aria-hidden="true"><use href="assets/icons.svg#ico-home"></use></svg><span>홈</span></a></li>
      <li><a href="#search">
        <svg class="ico" aria-hidden="true"><use href="assets/icons.svg#ico-search"></use></svg><span>검색</span></a></li>
      <li><a href="#explore">
        <svg class="ico" aria-hidden="true"><use href="assets/icons.svg#ico-explore"></use></svg><span>탐색 탭</span></a></li>
      <li><a href="#reels">
        <svg class="ico" aria-hidden="true"><use href="assets/icons.svg#ico-reels"></use></svg><span>릴스</span></a></li>
      <li><a href="#messages">
        <svg class="ico" aria-hidden="true"><use href="assets/icons.svg#ico-message"></use></svg><span>메시지</span></a></li>
      <li><a href="#notifications">
        <svg class="ico" aria-hidden="true"><use href="assets/icons.svg#ico-heart"></use></svg><span>알림</span></a></li>
      <li><a href="#create">
        <svg class="ico" aria-hidden="true"><use href="assets/icons.svg#ico-create"></use></svg><span>만들기</span></a></li>
      <li><a href="#dashboard">
        <svg class="ico" aria-hidden="true"><use href="assets/icons.svg#ico-dashboard"></use></svg><span>대시보드</span></a></li>
      <li><a href="profile.html" aria-current="page">
        <img class="sidebar-avatar" src="https://picsum.photos/seed/avatar1/64/64"
             alt="내 프로필" width="24" height="24"><span>프로필</span></a></li>
    </ul>
    <a class="sidebar-more" href="#more">
      <svg class="ico" aria-hidden="true"><use href="assets/icons.svg#ico-menu"></use></svg><span>더 보기</span></a>
  </nav>

  <main>
    <section class="profile-header">
      <img class="profile-avatar"
           src="https://picsum.photos/seed/avatar1/150/150"
           alt="홍순구님의 프로필 사진"
           width="150" height="150">
      <h2 class="profile-name">홍순구</h2>
      <ul class="profile-stats">
        <li><strong>42</strong> 게시물</li>
        <li><strong>8,500</strong> 팔로워</li>
        <li><strong>312</strong> 팔로잉</li>
      </ul>
      <p class="profile-bio">@hong_tutor · 풀스택 개발자 / 강의 진행 중</p>
    </section>

    <section class="profile-posts">
      <h3>내 게시물</h3>

      <div class="post-grid">
        <figure>
          <img src="https://picsum.photos/seed/myinsta1/300/300"
               alt="새벽 작업실 책상 위 키보드와 듀얼 모니터"
               width="300" height="300"
               loading="lazy">
          <figcaption>오늘의 작업실 #coding</figcaption>
        </figure>

        <figure>
          <img src="https://picsum.photos/seed/myinsta2/300/300"
               alt="강의장 화이트보드에 그려진 시스템 아키텍처 도식"
               width="300" height="300"
               loading="lazy">
          <figcaption>오늘의 강의 #teaching</figcaption>
        </figure>

        <figure>
          <img src="https://picsum.photos/seed/myinsta3/300/300"
               alt="저녁 노을이 물든 서울 한강 풍경"
               width="300" height="300"
               loading="lazy">
          <figcaption>퇴근길 한강 #sunset</figcaption>
        </figure>

        <figure>
          <img src="https://picsum.photos/seed/myinsta4/300/300"
               alt="책상 위에 놓인 커피와 노트북"
               width="300" height="300"
               loading="lazy">
          <figcaption>오전 코딩 한 잔 #coffee</figcaption>
        </figure>

        <figure>
          <img src="https://picsum.photos/seed/myinsta5/300/300"
               alt="개발 서적이 쌓인 책장"
               width="300" height="300"
               loading="lazy">
          <figcaption>이번 달 읽을 책 #booklist</figcaption>
        </figure>

        <figure>
          <img src="https://picsum.photos/seed/myinsta6/300/300"
               alt="동료들과 함께한 팀 점심 식사"
               width="300" height="300"
               loading="lazy">
          <figcaption>팀 점심 #foodie</figcaption>
        </figure>

        <figure>
          <img src="https://picsum.photos/seed/myinsta7/300/300"
               alt="해질녘 산책로를 달리는 러닝 트랙"
               width="300" height="300"
               loading="lazy">
          <figcaption>저녁 러닝 #running</figcaption>
        </figure>

        <figure>
          <img src="https://picsum.photos/seed/myinsta8/300/300"
               alt="창밖으로 보이는 도시 야경"
               width="300" height="300"
               loading="lazy">
          <figcaption>야근 뷰 #nightview</figcaption>
        </figure>

        <figure>
          <img src="https://picsum.photos/seed/myinsta9/300/300"
               alt="주말 등산길에서 바라본 산 정상 풍경"
               width="300" height="300"
               loading="lazy">
          <figcaption>주말 등산 #mountain</figcaption>
        </figure>
      </div>
    </section>
  </main>

  <!-- 모바일 하단 탭바 (작은 화면에서만 보임) -->
  <nav class="tabbar" aria-label="하단 탭">
    <a href="feed.html" aria-label="홈">
      <svg class="ico" aria-hidden="true"><use href="assets/icons.svg#ico-home"></use></svg></a>
    <a href="#search" aria-label="검색">
      <svg class="ico" aria-hidden="true"><use href="assets/icons.svg#ico-search"></use></svg></a>
    <a href="#reels" aria-label="릴스">
      <svg class="ico" aria-hidden="true"><use href="assets/icons.svg#ico-reels"></use></svg></a>
    <a href="#create" aria-label="만들기">
      <svg class="ico" aria-hidden="true"><use href="assets/icons.svg#ico-create"></use></svg></a>
    <a href="profile.html" aria-current="page" aria-label="프로필">
      <img class="tabbar-avatar" src="https://picsum.photos/seed/avatar1/64/64"
           alt="내 프로필" width="24" height="24"></a>
  </nav>
</body>
</html>
