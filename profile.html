<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Instagram - 프로필</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Grand+Hotel&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body class="app">
  <!-- 모바일 상단 바 (작은 화면에서만 보임) -->
  <header class="topbar">
    <h1 class="logo"><a href="index.html">Instagram</a></h1>
    <div class="topbar-actions">
      <a href="#notifications" aria-label="알림">
        <svg class="ico" aria-hidden="true"><use href="assets/icons.svg#ico-heart"></use></svg>
      </a>
      <a href="#messages" aria-label="메시지">
        <svg class="ico" aria-hidden="true"><use href="assets/icons.svg#ico-message"></use></svg>
      </a>
    </div>
  </header>

  <!-- 데스크톱 좌측 사이드바 -->
  <nav class="sidebar" aria-label="주요 메뉴">
    <h1 class="logo sidebar-logo">
      <a href="index.html">
        <span class="logo-text">Instagram</span>
        <svg class="ico logo-mark" aria-hidden="true"><use href="assets/icons.svg#ico-instagram"></use></svg>
      </a>
    </h1>
    <ul class="sidebar-menu">
      <li><a href="feed.html">
        <svg class="ico" aria-hidden="true"><use href="assets/icons.svg#ico-home"></use></svg><span>홈</span></a></li>
      <li><a href="#search">
        <svg class="ico" aria-hidden="true"><use href="assets/icons.svg#ico-search"></use></svg><span>검색</span></a></li>
      <li><a href="#explore">
        <svg class="ico" aria-hidden="true"><use href="assets/icons.svg#ico-explore"></use></svg><span>탐색 탭</span></a></li>
      <li><a href="#reels">
        <svg class="ico" aria-hidden="true"><use href="assets/icons.svg#ico-reels"></use></svg><span>릴스</span></a></li>
      <li><a href="#messages">
        <svg class="ico" aria-hidden="true"><use href="assets/icons.svg#ico-message"></use></svg><span>메시지</span></a></li>
      <li><a href="#notifications">
        <svg class="ico" aria-hidden="true"><use href="assets/icons.svg#ico-heart"></use></svg><span>알림</span></a></li>
      <li><a href="#create">
        <svg class="ico" aria-hidden="true"><use href="assets/icons.svg#ico-create"></use></svg><span>만들기</span></a></li>
      <li><a href="#dashboard">
        <svg class="ico" aria-hidden="true"><use href="assets/icons.svg#ico-dashboard"></use></svg><span>대시보드</span></a></li>
      <li><a href="profile.html" aria-current="page">
        <img class="sidebar-avatar" src="https://picsum.photos/seed/avatar1/64/64"
             alt="내 프로필" width="24" height="24"><span>프로필</span></a></li>
    </ul>
    <a class="sidebar-more" href="#more">
      <svg class="ico" aria-hidden="true"><use href="assets/icons.svg#ico-menu"></use></svg><span>더 보기</span></a>
  </nav>

  <main>
    <!-- 프로필 헤더 -->
    <section class="profile-header">
      <div class="profile-avatar-wrap">
        <img class="profile-avatar"
             src="https://picsum.photos/seed/avatar1/300/300"
             alt="홍순구님의 프로필 사진"
             width="150" height="150">
      </div>
      <div class="profile-meta">
        <div class="profile-row1">
          <h2 class="profile-username">soongu_hong</h2>
          <a class="btn-edit" href="#edit">프로필 편집</a>
          <a class="btn-edit" href="#archive">보관함 보기</a>
          <button type="button" class="profile-settings" aria-label="설정">
            <svg class="ico" aria-hidden="true"><use href="assets/icons.svg#ico-settings"></use></svg>
          </button>
        </div>
        <ul class="profile-stats">
          <li>게시물 <strong>49</strong></li>
          <li>팔로워 <strong>338</strong></li>
          <li>팔로우 <strong>210</strong></li>
        </ul>
        <p class="profile-name">홍순구</p>
        <p class="profile-bio">
          풀스택 개발자 · 강의 진행 중<br>
          #개발 #강의 #풀스택 #인스타클론<br>
          <a href="https://github.com/soongu" target="_blank" rel="noopener noreferrer">github.com/soongu</a>
        </p>
      </div>
    </section>

    <!-- 스토리 하이라이트 -->
    <section class="highlights" aria-label="스토리 하이라이트">
      <ul class="highlights-track">
        <li class="highlight"><a href="#highlight">
          <span class="highlight-cover"><img src="https://picsum.photos/seed/hl1/120/120" alt="일상 하이라이트" width="77" height="77"></span>
          <span class="highlight-name">일상</span></a></li>
        <li class="highlight"><a href="#highlight">
          <span class="highlight-cover"><img src="https://picsum.photos/seed/hl2/120/120" alt="여행 하이라이트" width="77" height="77"></span>
          <span class="highlight-name">여행</span></a></li>
        <li class="highlight"><a href="#highlight">
          <span class="highlight-cover"><img src="https://picsum.photos/seed/hl3/120/120" alt="강의 하이라이트" width="77" height="77"></span>
          <span class="highlight-name">강의</span></a></li>
        <li class="highlight"><a href="#highlight">
          <span class="highlight-cover"><img src="https://picsum.photos/seed/hl4/120/120" alt="맛집 하이라이트" width="77" height="77"></span>
          <span class="highlight-name">맛집</span></a></li>
        <li class="highlight"><a href="#highlight">
          <span class="highlight-cover"><img src="https://picsum.photos/seed/hl5/120/120" alt="코딩 하이라이트" width="77" height="77"></span>
          <span class="highlight-name">코딩</span></a></li>
        <li class="highlight"><a href="#highlight">
          <span class="highlight-cover"><img src="https://picsum.photos/seed/hl6/120/120" alt="운동 하이라이트" width="77" height="77"></span>
          <span class="highlight-name">운동</span></a></li>
        <li class="highlight"><a href="#new-highlight">
          <span class="highlight-cover highlight-new" aria-hidden="true">+</span>
          <span class="highlight-name">신규</span></a></li>
      </ul>
    </section>

    <!-- 프로필 탭바 -->
    <nav class="profile-tabs" aria-label="프로필 탭">
      <a href="#posts" aria-current="page">
        <svg class="ico" aria-hidden="true"><use href="assets/icons.svg#ico-grid"></use></svg>게시물</a>
      <a href="#reels">
        <svg class="ico" aria-hidden="true"><use href="assets/icons.svg#ico-reels"></use></svg>릴스</a>
      <a href="#saved">
        <svg class="ico" aria-hidden="true"><use href="assets/icons.svg#ico-save"></use></svg>저장됨</a>
      <a href="#tagged">
        <svg class="ico" aria-hidden="true"><use href="assets/icons.svg#ico-tagged"></use></svg>태그됨</a>
    </nav>

    <!-- 게시물 격자 -->
    <section class="profile-posts">
      <h2 class="sr-only">내 게시물</h2>

      <div class="post-grid">
        <figure>
          <img src="https://picsum.photos/seed/myinsta1/300/300"
               alt="새벽 작업실 책상 위 키보드와 듀얼 모니터"
               width="300" height="300" loading="lazy">
          <div class="grid-overlay">
            <span class="grid-stat"><svg class="ico" aria-hidden="true"><use href="assets/icons.svg#ico-heart-fill"></use></svg>1,240</span>
            <span class="grid-stat"><svg class="ico" aria-hidden="true"><use href="assets/icons.svg#ico-comment"></use></svg>32</span>
          </div>
        </figure>

        <figure>
          <img src="https://picsum.photos/seed/myinsta2/300/300"
               alt="강의장 화이트보드에 그려진 시스템 아키텍처 도식"
               width="300" height="300" loading="lazy">
          <div class="grid-overlay">
            <span class="grid-stat"><svg class="ico" aria-hidden="true"><use href="assets/icons.svg#ico-heart-fill"></use></svg>860</span>
            <span class="grid-stat"><svg class="ico" aria-hidden="true"><use href="assets/icons.svg#ico-comment"></use></svg>18</span>
          </div>
        </figure>

        <figure>
          <span class="grid-badge"><svg class="ico" aria-hidden="true"><use href="assets/icons.svg#ico-reels"></use></svg></span>
          <img src="https://picsum.photos/seed/myinsta3/300/300"
               alt="저녁 노을이 물든 서울 한강 풍경"
               width="300" height="300" loading="lazy">
          <div class="grid-overlay">
            <span class="grid-stat"><svg class="ico" aria-hidden="true"><use href="assets/icons.svg#ico-heart-fill"></use></svg>3,015</span>
            <span class="grid-stat"><svg class="ico" aria-hidden="true"><use href="assets/icons.svg#ico-comment"></use></svg>121</span>
          </div>
        </figure>

        <figure>
          <img src="https://picsum.photos/seed/myinsta4/300/300"
               alt="책상 위에 놓인 커피와 노트북"
               width="300" height="300" loading="lazy">
          <div class="grid-overlay">
            <span class="grid-stat"><svg class="ico" aria-hidden="true"><use href="assets/icons.svg#ico-heart-fill"></use></svg>540</span>
            <span class="grid-stat"><svg class="ico" aria-hidden="true"><use href="assets/icons.svg#ico-comment"></use></svg>9</span>
          </div>
        </figure>

        <figure>
          <img src="https://picsum.photos/seed/myinsta5/300/300"
               alt="개발 서적이 쌓인 책장"
               width="300" height="300" loading="lazy">
          <div class="grid-overlay">
            <span class="grid-stat"><svg class="ico" aria-hidden="true"><use href="assets/icons.svg#ico-heart-fill"></use></svg>712</span>
            <span class="grid-stat"><svg class="ico" aria-hidden="true"><use href="assets/icons.svg#ico-comment"></use></svg>24</span>
          </div>
        </figure>

        <figure>
          <img src="https://picsum.photos/seed/myinsta6/300/300"
               alt="동료들과 함께한 팀 점심 식사"
               width="300" height="300" loading="lazy">
          <div class="grid-overlay">
            <span class="grid-stat"><svg class="ico" aria-hidden="true"><use href="assets/icons.svg#ico-heart-fill"></use></svg>198</span>
            <span class="grid-stat"><svg class="ico" aria-hidden="true"><use href="assets/icons.svg#ico-comment"></use></svg>7</span>
          </div>
        </figure>

        <figure>
          <span class="grid-badge"><svg class="ico" aria-hidden="true"><use href="assets/icons.svg#ico-reels"></use></svg></span>
          <img src="https://picsum.photos/seed/myinsta7/300/300"
               alt="해질녘 산책로를 달리는 러닝 트랙"
               width="300" height="300" loading="lazy">
          <div class="grid-overlay">
            <span class="grid-stat"><svg class="ico" aria-hidden="true"><use href="assets/icons.svg#ico-heart-fill"></use></svg>4,820</span>
            <span class="grid-stat"><svg class="ico" aria-hidden="true"><use href="assets/icons.svg#ico-comment"></use></svg>203</span>
          </div>
        </figure>

        <figure>
          <img src="https://picsum.photos/seed/myinsta8/300/300"
               alt="창밖으로 보이는 도시 야경"
               width="300" height="300" loading="lazy">
          <div class="grid-overlay">
            <span class="grid-stat"><svg class="ico" aria-hidden="true"><use href="assets/icons.svg#ico-heart-fill"></use></svg>1,002</span>
            <span class="grid-stat"><svg class="ico" aria-hidden="true"><use href="assets/icons.svg#ico-comment"></use></svg>41</span>
          </div>
        </figure>

        <figure>
          <img src="https://picsum.photos/seed/myinsta9/300/300"
               alt="주말 등산길에서 바라본 산 정상 풍경"
               width="300" height="300" loading="lazy">
          <div class="grid-overlay">
            <span class="grid-stat"><svg class="ico" aria-hidden="true"><use href="assets/icons.svg#ico-heart-fill"></use></svg>665</span>
            <span class="grid-stat"><svg class="ico" aria-hidden="true"><use href="assets/icons.svg#ico-comment"></use></svg>15</span>
          </div>
        </figure>
      </div>
    </section>
  </main>

  <!-- 모바일 하단 탭바 (작은 화면에서만 보임) -->
  <nav class="tabbar" aria-label="하단 탭">
    <a href="feed.html" aria-label="홈">
      <svg class="ico" aria-hidden="true"><use href="assets/icons.svg#ico-home"></use></svg></a>
    <a href="#search" aria-label="검색">
      <svg class="ico" aria-hidden="true"><use href="assets/icons.svg#ico-search"></use></svg></a>
    <a href="#reels" aria-label="릴스">
      <svg class="ico" aria-hidden="true"><use href="assets/icons.svg#ico-reels"></use></svg></a>
    <a href="#create" aria-label="만들기">
      <svg class="ico" aria-hidden="true"><use href="assets/icons.svg#ico-create"></use></svg></a>
    <a href="profile.html" aria-current="page" aria-label="프로필">
      <img class="tabbar-avatar" src="https://picsum.photos/seed/avatar1/64/64"
           alt="내 프로필" width="24" height="24"></a>
  </nav>
</body>
</html>
